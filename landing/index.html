<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerek: We Carry What Matters Most</title>
  <meta name="description" content="Gerek digitalises Malaysia's school vans and buses: live tracking, boarding alerts and fee payments in one app.">
  <meta name="theme-color" content="#1591DC">
  <meta name="color-scheme" content="light dark">
  <!-- Apply a saved light/dark choice before first paint (no flash). -->
  <script>try{var gt=localStorage.getItem("gerek-theme");if(gt==="dark"||gt==="light")document.documentElement.setAttribute("data-theme",gt)}catch(e){}</script>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gerek: We Carry What Matters Most">
  <meta property="og:description" content="Live tracking, boarding alerts and fee payments for Malaysia's school vans and buses.">

  <link rel="icon" type="image/png" href="assets/brand/app_icon.png">
  <link rel="apple-touch-icon" href="assets/brand/app_icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@600;700&family=Lexend:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip" href="#main" data-copy="ui.skip">Langkau ke kandungan</a>

  <!-- ============ HERO ============ -->
  <header class="hero on-blue">
    <div class="wrap hero__grid">
      <div class="hero__bar">
        <span class="wordmark">
          <img src="assets/brand/wordmark_white.png" width="512" height="120" alt="Gerek">
        </span>
        <div class="hero__tools">
          <button type="button" class="theme-btn" id="theme-btn" aria-pressed="false" data-copy-label="ui.themeDark" aria-label="Mod gelap">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" fill="currentColor"/>
            </svg>
          </button>
          <div class="lang" role="group" data-copy-label="ui.langGroup" aria-label="Bahasa">
            <button type="button" class="lang__btn" data-lang="bm" lang="ms" aria-pressed="true">BM</button>
            <button type="button" class="lang__btn" data-lang="en" lang="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </div>

      <h1 class="hero__slogan" data-copy="hero.slogan">We Carry What Matters Most</h1>

      <figure class="alerts">
        <figcaption class="sr-only" data-copy="hero.alertsLabel"></figcaption>

        <div class="alert alert--boarded">
          <span class="alert__icon">
            <img src="assets/brand/app_icon.png" width="40" height="40" alt="">
            <svg class="alert__badge" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <circle cx="10" cy="10" r="10"/>
              <path d="M5.6 10.4l2.9 2.8 5.9-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <p class="alert__head"><span>Gerek</span><span data-copy="hero.alertBoarded.time"></span></p>
          <p class="alert__title" data-copy="hero.alertBoarded.title"></p>
          <p class="alert__body" data-copy="hero.alertBoarded.body"></p>
        </div>

        <div class="alert alert--near">
          <span class="alert__icon">
            <img src="assets/brand/app_icon.png" width="40" height="40" alt="">
          </span>
          <p class="alert__head"><span>Gerek</span><span data-copy="hero.alertNear.time"></span></p>
          <p class="alert__title" data-copy="hero.alertNear.title"></p>
          <p class="alert__body" data-copy="hero.alertNear.body"></p>
        </div>
      </figure>
    </div>
  </header>

  <main id="main" tabindex="-1">

    <!-- ============ PITCH + CTA ============ -->
    <section class="intro">
      <div class="wrap">
        <div class="intro__body">
          <p class="intro__pitch" data-copy="hero.pitch"></p>
          <a class="button" href="#survey" data-copy="hero.cta">Jawab kaji selidik</a>
        </div>
      </div>
    </section>

    <!-- ============ SURVEY PANEL ============ -->
    <section id="survey" class="band band--mist" aria-labelledby="survey-h" tabindex="-1">
      <div class="wrap">
        <div class="section-head">
          <h2 id="survey-h" class="h2" data-copy="survey.heading"></h2>
          <p class="lede" data-copy="survey.intro"></p>
        </div>
        <ul class="survey-grid" id="survey-list"></ul>
        <p class="survey-waiting" id="survey-waiting" hidden>
          <span data-copy="survey.waiting"></span>
          <a class="link" data-ig-link href="#"></a>
        </p>
      </div>
    </section>

    <!-- ============ PROBLEM & PROOF ============ -->
    <section class="band" aria-labelledby="proof-h">
      <div class="wrap proof">
        <div class="proof__text">
          <h2 id="proof-h" class="h2" data-copy="proof.heading"></h2>
          <p class="lede" data-copy="proof.body"></p>
        </div>
        <div class="proof__stats" id="stats-block">
          <p class="notice" id="stats-sample" hidden data-copy="proof.sampleNotice"></p>
          <ul class="stats" id="stats-list"></ul>
          <p class="source" id="stats-source"></p>
        </div>
      </div>
    </section>

    <!-- ============ COMPANY BACKGROUND ============ -->
    <section class="band band--mist" aria-labelledby="about-h">
      <div class="wrap about">
        <div class="about__name">
          <h2 id="about-h" class="h2" data-copy="about.heading"></h2>
          <div class="entry">
            <p class="entry__word" lang="ms" data-copy="about.word"></p>
            <p class="entry__class" data-copy="about.wordClass"></p>
            <p class="entry__meaning" data-copy="about.meaning"></p>
          </div>
          <p data-copy="about.origin"></p>
        </div>
        <div class="about__mission">
          <h3 class="h3" data-copy="about.missionHeading"></h3>
          <p data-copy="about.mission"></p>
          <h3 class="h3" data-copy="about.safetyHeading"></h3>
          <p class="stance" data-copy="about.safety"></p>
        </div>
      </div>
    </section>

    <!-- ============ OBJECTIVES ============ -->
    <section class="band band--ink on-dark" aria-labelledby="goals-h">
      <div class="wrap">
        <div class="section-head">
          <h2 id="goals-h" class="h2" data-copy="objectives.heading"></h2>
          <p class="lede" data-copy="objectives.intro"></p>
        </div>
        <div class="apps" id="apps"></div>
        <h3 class="h3 support-heading" data-copy="objectives.supportHeading"></h3>
        <dl class="support" id="support"></dl>
      </div>
    </section>

    <!-- ============ TEAM ============ -->
    <section class="band" id="team" aria-labelledby="team-h">
      <div class="wrap">
        <h2 id="team-h" class="h2 team-heading" data-copy="team.heading"></h2>
        <ul class="team-grid" id="team-list"></ul>
      </div>
    </section>
  </main>

  <!-- ============ CONTACT / FOOTER ============ -->
  <footer class="footer on-dark" id="contact" aria-labelledby="contact-h">
    <div class="wrap footer__grid">
      <div>
        <h2 id="contact-h" class="h2" data-copy="contact.heading"></h2>
        <p class="lede" data-copy="contact.body"></p>
      </div>
      <ul class="contact-links">
        <li>
          <span class="contact-links__label" data-copy="contact.emailLabel"></span>
          <a class="contact-links__value" id="email-link" href="mailto:gerekco@gmail.com">gerekco@gmail.com</a>
        </li>
        <li>
          <span class="contact-links__label" data-copy="contact.instagramLabel"></span>
          <a class="contact-links__value" data-ig-link href="https://www.instagram.com/gerekcorp/">@gerekcorp</a>
        </li>
      </ul>
    </div>
    <div class="wrap footer__base">
      <span class="wordmark wordmark--small">
        <img src="assets/brand/wordmark_white.png" width="512" height="120" alt="Gerek" loading="lazy">
      </span>
      <p class="footer__rights">&copy; <span id="year">2026</span> <span data-copy="contact.rights"></span></p>
    </div>
  </footer>

  <noscript>
    <p class="noscript">Gerek: gerekco@gmail.com, Instagram @gerekcorp</p>
  </noscript>

  <script src="config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
